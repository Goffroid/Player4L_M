<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify-like Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="icon" href="/static/spotify-icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Circular:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --spotify-black: #191414;
            --spotify-green: #1DB954;
            --spotify-white: #FFFFFF;
            --spotify-light-gray: #B3B3B3;
            --spotify-dark-gray: #535353;
            --spotify-bg-gradient: linear-gradient(135deg, #2D2D2D 0%, #191414 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Circular', Helvetica, Arial, sans-serif;
            background-color: var(--spotify-black);
            color: var(--spotify-white);
            min-height: 100vh;
            padding-bottom: 20px;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-top: 10px;
        }
        
        .player-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--spotify-white);
            letter-spacing: -0.5px;
        }
        
        .now-playing {
            background: var(--spotify-bg-gradient);
            border-radius: 12px;
            padding: 25px 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        
        .album-art-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
        }
        
        .album-art {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        
        .album-art.playing {
            animation: rotateAlbumArt 15s linear infinite;
        }
        
        @keyframes rotateAlbumArt {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .track-info {
            margin-bottom: 25px;
        }
        
        .track-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .artist-name {
            font-size: 15px;
            color: var(--spotify-light-gray);
            font-weight: 500;
        }
        
        .progress-container {
            margin: 25px 0 15px;
        }
        
        .progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: var(--spotify-dark-gray);
            outline: none;
            margin-bottom: 5px;
            cursor: pointer;
            transition: height 0.2s ease;
        }
        
        .progress-bar:hover {
            height: 8px;
        }
        
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--spotify-white);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .progress-bar:hover::-webkit-slider-thumb {
            opacity: 1;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--spotify-light-gray);
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 30px 0;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: var(--spotify-white);
            font-size: 24px;
            cursor: pointer;
            opacity: 0.8;
            transition: all 0.2s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .play-btn {
            background-color: var(--spotify-green);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(29, 185, 84, 0.4);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(29, 185, 84, 0.5);
        }
        
        .play-btn:active {
            transform: scale(0.98);
        }
        
        .track-list {
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .track-list-header {
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.05);
            font-size: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }
        
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .track-item:last-child {
            border-bottom: none;
        }
        
        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        
        .track-item.active {
            background-color: rgba(29, 185, 84, 0.1);
        }
        
        .track-number {
            width: 30px;
            color: var(--spotify-light-gray);
            font-size: 14px;
            font-weight: 500;
        }
        
        .track-item.active .track-number {
            color: var(--spotify-green);
        }
        
        .track-details {
            flex: 1;
            min-width: 0;
            padding-right: 15px;
        }
        
        .track-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-item.active .track-title {
            color: var(--spotify-green);
            font-weight: 600;
        }
        
        .track-artist {
            font-size: 13px;
            color: var(--spotify-light-gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .track-duration {
            color: var(--spotify-light-gray);
            font-size: 14px;
        }
        
        .upload-section {
            margin-top: 30px;
            text-align: center;
        }
        
        .upload-btn {
            background-color: var(--spotify-green);
            color: var(--spotify-white);
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.3);
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(29, 185, 84, 0.4);
        }
        
        .upload-btn:active {
            transform: translateY(0);
        }
        
        input[type="file"] {
            display: none;
        }
        
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-header">
            <div class="player-title">Music Player</div>
        </div>
        
        <div class="now-playing">
            <div class="album-art-container">
                <img id="album-art" src="/static/default-album.png" class="album-art" alt="Album Art">
            </div>
            
            <div class="track-info">
                <div id="track-name" class="track-name">Not Playing</div>
                <div id="artist-name" class="artist-name">—</div>
            </div>
            
            <div class="progress-container">
                <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="controls">
                <button id="prev-btn" class="control-btn">⏮</button>
                <button id="play-btn" class="play-btn">▶</button>
                <button id="next-btn" class="control-btn">⏭</button>
            </div>
        </div>
        
        <div class="track-list">
            <div class="track-list-header">
                <span>Track List</span>
                <span id="tracks-count">0 tracks</span>
            </div>
            <div id="track-list">
            </div>
        </div>
        
        <div class="upload-section">
            <input type="file" id="file-input" accept="audio/*">
            <button id="upload-btn" class="upload-btn">
                <span>Upload Track</span>
            </button>
        </div>
    </div>
    <!-- Добавляем после .player-header -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search tracks..." class="search-input">
        <button id="search-btn" class="search-btn">🔍</button>
    </div>

    <script src="/static/player.js"></script>
</body>
</html>
